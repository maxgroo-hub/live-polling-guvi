version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: polling_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=polling_db

  redis:
    image: redis:7.2-alpine
    container_name: polling_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polling_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017/polling_db
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=dev_jwt_secret_key_change_in_production_12345
      - GIN_MODE=release
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: polling_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
